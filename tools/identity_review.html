<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PJSK 角色样本核实</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f6f8;color:#202635;margin:0}header{padding:18px 24px;background:#fff;border-bottom:1px solid #ddd}h1{font-size:21px;margin:0 0 10px}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #aeb8c8;border-radius:6px}button{cursor:pointer;background:#fff}button.primary{background:#315de0;color:#fff}main{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:20px}figure{margin:0;background:#fff;border-radius:12px;padding:14px}img{width:100%;height:66vh;object-fit:contain}section{background:#fff;padding:18px;border-radius:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.muted{font-size:13px;color:#586679;line-height:1.6}.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.role{padding:7px;border:1px solid #ddd;border-radius:5px}textarea{width:95%;min-height:55px}.warning{color:#a14200}#message{min-height:24px}#groups{white-space:pre-wrap;max-height:240px;overflow:auto}@media(max-width:800px){main{grid-template-columns:1fr}img{height:45vh}}
</style>
<header><h1>PJSK 角色样本核实</h1><div class="muted">预填建议不是标准答案。请看图核对全部角色，不确定就标记“待定”。标注只保存到你的浏览器/导出文件，不会修改 Bot 图库或上传图片。</div>
<div class="row"><label>核实人 <input id="reviewer" placeholder="填写名字或昵称"></label><button id="export" class="primary">导出标注 JSON</button><label>继续已有标注 <input id="import" type="file" accept=".json"></label></div></header>
<main><figure><div class="row"><button id="prev">上一张</button><span id="progress"></span><button id="next">下一张</button><select id="jump"></select></div><img id="image" alt="待核实样本"><figcaption id="caption" class="muted"></figcaption></figure>
<section><h2 id="sampleTitle"></h2><p id="suggestions" class="muted"></p><button id="useSuggestions">采用建议后再核对</button><p>图中明确出现的 PJSK 角色：</p><div id="roles" class="roles"></div>
<div class="row"><label><input type="radio" name="target" value="yes">有目标角色</label><label><input type="radio" name="target" value="no">没有目标角色</label><label><input type="radio" name="target" value="unknown">不确定</label></div>
<textarea id="notes" placeholder="漏标、易混淆角色、遮挡等备注"></textarea>
<p><label><input id="complete" type="checkbox">我已逐一核实全部目标角色，列表没有漏人或多报</label></p>
<div class="row"><button id="verify" class="primary">确认这张标注</button><button id="uncertain">标记待定</button><button id="save">保存草稿</button></div><p id="message" class="warning"></p>
<details><summary>开发/验收集的同源与相似图分组</summary><p class="muted">检查同图、裁切和近似变体没有跨集合。若发现分组错误，请保留未确认状态，并在导出的 JSON 中修正 group_id/split 后重新导入。</p><pre id="groups"></pre><label><input id="splitReviewed" type="checkbox">我已核对分组，确认没有已知同源/近重复图跨集合</label></details>
<p class="muted">“已保存到浏览器”不替代备份。离开前请点击“导出标注 JSON”。不必一次核实全部 200 张；未核实样本不会进入准确率计算。</p></section></main>
<script type="application/json" id="manifest">__MANIFEST_JSON__</script>
<script>
'use strict';
const original=JSON.parse(document.getElementById('manifest').textContent);let data=structuredClone(original),index=0,dirty=false;
const $=id=>document.getElementById(id),storageKey='pjsk-review:'+data.dataset_id;
function compatible(next){return next.dataset_id===original.dataset_id&&Array.isArray(next.samples)&&next.samples.length===original.samples.length&&next.samples.every((s,i)=>s.sample_id===original.samples[i].sample_id&&s.original_sha256===original.samples[i].original_sha256)}
function restore(next){if(!compatible(next))throw Error('标注文件与当前样本包不匹配');const keys=new Set(original.roster.map(r=>r.key));if(next.samples.some(s=>!s.label||!['pending','uncertain','human_verified'].includes(s.label.status)||!Array.isArray(s.label.character_keys)||s.label.character_keys.some(k=>!keys.has(k))||!['development','holdout'].includes(s.split)||!s.group_id||typeof s.label.reviewer!=='string'||typeof s.label.notes!=='string'||typeof s.label.complete!=='boolean'||![true,false,null].includes(s.label.is_target)))throw Error('标注字段或样本分组无效');data=structuredClone(original);data.split_reviewed=next.split_reviewed===true;data.samples.forEach((s,i)=>{s.label=next.samples[i].label;s.group_id=String(next.samples[i].group_id);s.split=next.samples[i].split});dirty=false;}
try{const saved=localStorage.getItem(storageKey);if(saved)restore(JSON.parse(saved))}catch(e){$('message').textContent='浏览器草稿未载入：'+e.message}
function updateSummary(){data.summary.verified=data.samples.filter(s=>s.label.status==='human_verified').length;data.summary.splits={};data.samples.forEach(s=>data.summary.splits[s.split]=(data.summary.splits[s.split]||0)+1)}
function persist(){updateSummary();try{localStorage.setItem(storageKey,JSON.stringify(data))}catch(e){$('message').textContent='浏览器无法保存草稿，请导出 JSON：'+e.message}}
function names(keys){return keys.map(k=>data.roster.find(r=>r.key===k)?.name||k).join('、')||'无建议'}
function selected(){return [...$('roles').querySelectorAll('input:checked')].map(el=>el.value)}
function draft(status='pending'){const target=document.querySelector('input[name=target]:checked')?.value;const sample=data.samples[index];sample.label={status,character_keys:selected(),is_target:target==='yes'?true:target==='no'?false:null,complete:$('complete').checked,reviewer:$('reviewer').value.trim(),notes:$('notes').value};dirty=false;return sample.label}
function flush(){if(dirty){draft();persist()}}
function updateGroups(){const groups={};data.samples.forEach(s=>{const key=s.split+' / '+s.group_id;(groups[key]??=[]).push(s.sample_id)});$('groups').textContent=Object.entries(groups).map(([k,v])=>k+': '+v.join(', ')).join('\n');$('splitReviewed').checked=data.split_reviewed===true}
function render(){const s=data.samples[index],label=s.label||{};$('image').src=s.image;$('sampleTitle').textContent=s.sample_id+' · '+(label.status==='human_verified'?'已核实':label.status==='uncertain'?'待定':'待核实');$('progress').textContent=(index+1)+' / '+data.samples.length+'，已核实 '+data.samples.filter(x=>x.label.status==='human_verified').length+' 张';$('caption').textContent='集合：'+s.split+'；分组：'+s.group_id+'；图库ID：'+(s.image_id??'未入库');$('suggestions').textContent='未核实建议：'+names(s.suggested_character_keys)+'；来源：'+s.provenance;$('roles').replaceChildren();data.roster.forEach(r=>{const wrap=document.createElement('label');wrap.className='role';const box=document.createElement('input');box.type='checkbox';box.value=r.key;box.checked=(label.character_keys||[]).includes(r.key);wrap.append(box,document.createTextNode(' '+r.name));$('roles').append(wrap)});document.querySelectorAll('input[name=target]').forEach(el=>el.checked=el.value===(label.is_target===true?'yes':label.is_target===false?'no':'unknown'));$('complete').checked=label.complete===true;$('notes').value=label.notes||'';if(label.reviewer)$('reviewer').value=label.reviewer;$('jump').value=String(index);updateGroups()}
data.samples.forEach((s,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=s.sample_id;$('jump').append(o)});
$('prev').onclick=()=>{flush();index=Math.max(0,index-1);render()};$('next').onclick=()=>{flush();index=Math.min(data.samples.length-1,index+1);render()};$('jump').onchange=()=>{flush();index=Number($('jump').value);render()};
$('useSuggestions').onclick=()=>{const keys=data.samples[index].suggested_character_keys;$('roles').querySelectorAll('input').forEach(el=>el.checked=keys.includes(el.value));document.querySelector('input[name=target][value='+(keys.length?'yes':'unknown')+']').checked=true;$('complete').checked=false;dirty=true;$('message').textContent='已采用建议，请看图核实后再确认。'};
$('save').onclick=()=>{draft();persist();$('message').textContent='草稿已保存；这张还未计入已核实。';render()};
$('uncertain').onclick=()=>{draft('uncertain');data.samples[index].label.complete=false;persist();$('message').textContent='已标记待定，不参与准确率计算。';render()};
$('verify').onclick=()=>{const label=draft();persist();if(!label.reviewer||!label.complete||label.is_target===null||Boolean(label.character_keys.length)!==label.is_target){$('message').textContent='请填写核实人、确认完整性，并确保目标角色选项与勾选列表一致。';return}label.status='human_verified';persist();$('message').textContent='这张已核实，记得导出标注文件。';render()};
$('splitReviewed').onchange=()=>{data.split_reviewed=$('splitReviewed').checked;persist()};
$('export').onclick=()=>{flush();updateSummary();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=data.dataset_id+'-labels.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=async()=>{try{const file=$('import').files[0];if(!file)return;restore(JSON.parse(await file.text()));persist();render();$('message').textContent='已恢复标注；图片仍使用当前样本包。'}catch(e){$('message').textContent=e.message}};
document.querySelector('section').addEventListener('change',event=>{if(event.target.closest('#roles')||event.target.name==='target'||event.target.id==='complete'){if(event.target.id!=='complete')$('complete').checked=false;dirty=true;flush();$('sampleTitle').textContent=data.samples[index].sample_id+' · 待核实'}});
$('notes').oninput=()=>{dirty=true};$('reviewer').oninput=()=>{dirty=true};window.addEventListener('beforeunload',flush);
render();
</script></html>
